# ==============================================================================
# CreditLens Render Infrastructure Blueprint (render.yaml)
# Enables one-click Blueprint deployment for the FastAPI backend service
# ==============================================================================

services:
  - type: web
    name: creditlens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      # Comma-separated list of allowed frontend origins, e.g.
      # https://ai-powered-credit-risk-financial-in.vercel.app
      # The app also accepts this value under the name CORS_ORIGINS.
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_ENABLED
        value: "true"
